# geoextract served map + API.
#
# TLS, hostnames and the outer basic-auth live in the SHARED Caddy stack on the
# server (~/Workspace/server-proxy → /opt/proxy), which reaches this API over the
# external docker network "proxy" under the alias "geo-api" and serves
# data/serve/<SCOPE>/current/ as static files itself (PMTiles need HTTP Range).
# Locally the API serves the page and the data on its own — no Caddy needed.
#
#   laptop:  SCOPE=bremen docker compose up -d      → http://localhost:8791/
#   server:  docker compose up -d                   (proxy stack must be up: it owns the network)
#
# Layout on the host:  ./data/serve/<SCOPE>/<version>/  (built by the builder profile or by
# `geoextract serve build`), with ./data/serve/<SCOPE>/current → the version to serve.

x-common: &common
  build:
    context: .
    target: ${IMAGE_TARGET:-runtime}   # "full" adds tippecanoe for the builder profile
  image: geoextract:${IMAGE_TARGET:-runtime}
  environment:
    GEOEXTRACT_DATA_DIR: /data
  volumes:
    - ./data:/data

services:
  api:
    <<: *common
    command: ["serve", "api", "--scope", "${SCOPE:-DE}", "--host", "0.0.0.0", "--port", "8791"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp            # csv / parquet exports are written here before streaming
    ports:
      - "127.0.0.1:${API_PORT:-8791}:8791"   # localhost only; the proxy reaches it over the network below
    networks:
      proxy:
        aliases:
          - geo-api     # the name the shared Caddy proxies to

  # one-shot: merged parquet → serve version (tiles, extracts, manifest) + `current` switch
  builder:
    <<: *common
    profiles: ["build"]
    command: ["serve", "build", "--scope", "${SCOPE:-DE}", "--force"]
    networks:
      - proxy

networks:
  proxy:
    external: true      # created by the shared proxy stack
