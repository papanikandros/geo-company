[project]
name = "geo-company"
version = "0.1.0"
description = "Extract German companies (name, website, address, grounds area) from open geodata"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyrosm>=0.11.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["bokeh>=3.4", "xyzservices>=2023.10"]

[project.scripts]
geoextract = "geoextract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoextract"]
