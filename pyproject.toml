[project]
name = "geoextract"
version = "0.1.0"
description = "Bottom-up extraction of German companies (name, address, geolocation, website, grounds area, NACE) from open geodata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "quackosm>=0.18",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
viz = ["folium>=0.16"]
classify = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "extruct>=0.16",
    "phonenumbers>=8.13",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "openai>=1.30",
]
ai = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
crawl = ["crawl4ai>=0.4"]
mastr = ["open-mastr>=0.14"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
geoextract = "geoextract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoextract"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
